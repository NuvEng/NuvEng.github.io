name: Build and Deploy Addon

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:        # manual trigger from Actions tab
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Build static addon files
        run: node build.js
        env:
          ANIMESCHEDULE_TOKEN: ${{ secrets.ANIMESCHEDULE_TOKEN }}
          RPDB_KEY: ${{ secrets.RPDB_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub auto-disables scheduled workflows after 60 days with no commits.
  # Re-enabling the workflow via the API on every scheduled run resets that
  # timer, so the cron keeps firing forever without needing dummy commits.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
